name: Compile Release

on: 
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo build --release
    - name: Create Zip
      run: Compress-Archive -path target/release/smush_lut.exe -destinationPath smush_lut_win_x64.zip 
    - name: Upload Zip
      uses: actions/upload-artifact@v4
      with:
        name: smush_lut_win_x64
        path: smush_lut_win_x64.zip
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: smush_lut_win_x64.zip
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin]
        desc: [intel]
        include:
          - target: aarch64-apple-darwin
            desc: apple_silicon
    steps:
    - uses: actions/checkout@v3
    - name: Install Rust Toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: ${{matrix.target}}
    - name: Build
      run: cargo build --release --target ${{matrix.target}}
    - name: Sign Binary
      run: codesign -s - target/${{matrix.target}}/release/smush_lut
    - name: Create Release Zip
      run: zip -j smush_lut_macos_${{matrix.desc}}.zip target/${{matrix.target}}/release/smush_lut
    - name: Upload Zip
      uses: actions/upload-artifact@v4
      with:
        name: smush_lut_macos_${{matrix.desc}}
        path: smush_lut_macos_${{matrix.desc}}.zip
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: smush_lut_macos_${{matrix.desc}}.zip
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo rustc --release -- -C link-args=-lstdc++
    - name: Create Zip
      run: zip -j smush_lut_linux_x64.zip target/release/smush_lut
    - name: Upload Zip
      uses: actions/upload-artifact@v4
      with:
        name: smush_lut_linux_x64
        path: smush_lut_linux_x64.zip
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: smush_lut_linux_x64.zip
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
